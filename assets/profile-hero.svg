    <text x="42" y="85" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#EEF2F3">I build VLAs that remember,</text>
    <text x="42" y="121" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#EEF2F3">reason, and act across time.</text>
