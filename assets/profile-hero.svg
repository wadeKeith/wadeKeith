<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cheng Yin — memory in action</title>
  <desc id="desc">Research profile banner showing timestamped observations retained until a robot action is selected.</desc>

