      <circle cx="601" cy="91" r="5" fill="#54C6BE"/>
      <text x="601" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#EEF2F3">OBS 02</text>
      <text x="601" y="138" text-anchor="middle" font-size="10" fill="#8FA1AE">t−20s</text>
